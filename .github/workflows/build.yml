name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ALSA dev headers
        run: sudo apt-get install -y libasound2-dev

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  test-e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests
        run: npm run test:e2e

  build-windows:
    needs: [ test, test-e2e ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WinsLab-windows
          path: dist/*.exe
          retention-days: 30

  build-mac:
    needs: [ test, test-e2e ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run dist:mac

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: WinsLab-mac
          path: dist/*.dmg
          retention-days: 30

  release:
    needs: [ build-windows, build-mac ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*

  upload-r2:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          TAG: ${{ github.ref_name }}
        run: |
          EXE=$(find artifacts -name "*.exe" | head -1)
          DMG=$(find artifacts -name "*.dmg" | head -1)
          aws s3 cp "$EXE" "s3://$R2_BUCKET/versions/$TAG/WinsLab-Setup.exe" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$DMG" "s3://$R2_BUCKET/versions/$TAG/WinsLab.dmg"       --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$EXE" "s3://$R2_BUCKET/latest/WinsLab-Setup.exe"        --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$DMG" "s3://$R2_BUCKET/latest/WinsLab.dmg"              --endpoint-url "$R2_ENDPOINT"

