<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
  body { margin: 0; background: #181818; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px 20px; }
  .grid { display: flex; gap: 12px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .bar { width: 6px; height: 28px; border-radius: 2px; }
  .label { font-size: 9px; color: #555; text-transform: capitalize; }
  .hex { font-size: 8px; color: #444; font-family: monospace; }
  .title { font-size: 10px; font-weight: 600; color: #555; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
</style></head>
<body>
<div class="title">Cue Color Labels</div>
<div class="grid">
  <div class="item"><div class="bar" style="background:transparent;border:1px dashed #444"></div><div class="label">none</div></div>
  <div class="item"><div class="bar" style="background:#c0392b"></div><div class="label">red</div><div class="hex">#c0392b</div></div>
  <div class="item"><div class="bar" style="background:#e67e22"></div><div class="label">orange</div><div class="hex">#e67e22</div></div>
  <div class="item"><div class="bar" style="background:#f1c40f"></div><div class="label">yellow</div><div class="hex">#f1c40f</div></div>
  <div class="item"><div class="bar" style="background:#27ae60"></div><div class="label">green</div><div class="hex">#27ae60</div></div>
  <div class="item"><div class="bar" style="background:#2980b9"></div><div class="label">blue</div><div class="hex">#2980b9</div></div>
  <div class="item"><div class="bar" style="background:#8e44ad"></div><div class="label">purple</div><div class="hex">#8e44ad</div></div>
  <div class="item"><div class="bar" style="background:#e91e8c"></div><div class="label">pink</div><div class="hex">#e91e8c</div></div>
</div>
</body>
</html>
