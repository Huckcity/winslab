<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
  body { margin: 0; background: #181818; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px 20px; }
  .row { display: flex; flex-direction: column; gap: 7px; }
  .item { display: flex; align-items: baseline; gap: 12px; }
  .sample { font-size: 14px; min-width: 120px; }
  .meta { font-size: 10px; color: #444; font-family: monospace; }
</style></head>
<body>
<div class="row">
  <div class="item"><span class="sample" style="color:#ddd">fg-primary #ddd</span><span class="meta">headings, selected row</span></div>
  <div class="item"><span class="sample" style="color:#ccc">fg-body #ccc</span><span class="meta">base body text</span></div>
  <div class="item"><span class="sample" style="color:#bbb">fg-secondary #bbb</span><span class="meta">cue row text</span></div>
  <div class="item"><span class="sample" style="color:#aaa">fg-tertiary #aaa</span><span class="meta">workspace name, secondary labels</span></div>
  <div class="item"><span class="sample" style="color:#888">fg-muted #888</span><span class="meta">form labels, cue numbers</span></div>
  <div class="item"><span class="sample" style="color:#666">fg-dim #666</span><span class="meta">column headers, durations</span></div>
  <div class="item"><span class="sample" style="color:#555">fg-ghost #555</span><span class="meta">empty states, placeholders</span></div>
</div>
</body>
</html>
