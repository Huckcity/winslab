<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
  body { margin: 0; background: #1e1e1e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 18px 22px; }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; }
  .sample { color: #ccc; }
  .meta { font-size: 10px; color: #444; font-family: monospace; white-space: nowrap; }
</style></head>
<body>
  <div class="row">
    <span class="sample" style="font-size:18px;font-weight:700;color:#e0a020;letter-spacing:0.05em;text-transform:uppercase">WINSLAB</span>
    <span class="meta">18px/700 — brand wordmark</span>
  </div>
  <div class="row">
    <span class="sample" style="font-size:18px;font-weight:700;letter-spacing:0.05em">▶ GO</span>
    <span class="meta">18px/700 — transport button</span>
  </div>
  <div class="row">
    <span class="sample" style="font-size:16px">Workspace Name</span>
    <span class="meta">16px/400 — body, menu items</span>
  </div>
  <div class="row">
    <span class="sample" style="font-size:15px;color:#bbb">01 — Intro Music</span>
    <span class="meta">15px/400 — cue row text</span>
  </div>
  <div class="row">
    <span class="sample" style="font-size:13px;color:#888">0:04.2</span>
    <span class="meta" style="font-family:monospace">13px — timecodes / labels</span>
  </div>
  <div class="row">
    <span class="sample" style="font-size:12px;font-weight:600;color:#555;letter-spacing:0.08em;text-transform:uppercase">Timing</span>
    <span class="meta">12px/600 UPPERCASE — section titles</span>
  </div>
  <div class="row">
    <span class="sample" style="font-size:12px;font-weight:600;color:#666;letter-spacing:0.06em;text-transform:uppercase">Name</span>
    <span class="meta">12px/600 UPPERCASE — column headers</span>
  </div>
</body>
</html>
